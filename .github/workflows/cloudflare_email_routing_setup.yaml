name: Cloudflare Email Routing Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Email Routing and configure catch-all
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAIL_DOMAIN: dnsayhey.xyz
          WORKER_NAME: cloudflare_temp_email
        run: |
          set -euo pipefail

          cf_api() {
            local method="$1"
            local path="$2"
            local data="${3:-}"
            if [ -n "$data" ]; then
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --header "Authorization: Bearer $CF_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "$data" \
                "https://api.cloudflare.com/client/v4$path"
            else
              curl --fail-with-body --silent --show-error \
                --request "$method" \
                --header "Authorization: Bearer $CF_API_TOKEN" \
                --header "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4$path"
            fi
          }

          zone_response="$(cf_api GET "/zones?name=$MAIL_DOMAIN&account.id=$CF_ACCOUNT_ID")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_response")"
          if [ -z "$zone_id" ]; then
            echo "Cloudflare zone not found for $MAIL_DOMAIN"
            jq '{success, errors, result_info}' <<<"$zone_response"
            exit 1
          fi

          echo "Found Cloudflare zone for $MAIL_DOMAIN"
          routing_response="$(cf_api GET "/zones/$zone_id/email/routing")"
          routing_enabled="$(jq -r '.result.enabled // false' <<<"$routing_response")"
          if [ "$routing_enabled" != "true" ]; then
            echo "Enabling Email Routing"
            cf_api POST "/zones/$zone_id/email/routing/enable" | jq '{success, errors, result}'
          else
            echo "Email Routing is already enabled"
          fi

          catch_all_payload="$(jq -nc --arg worker "$WORKER_NAME" '{name:"Catch all", enabled:true, matchers:[{type:"all"}], actions:[{type:"worker", value:[$worker]}]}')"
          echo "Configuring catch-all delivery to Worker $WORKER_NAME"
          cf_api PUT "/zones/$zone_id/email/routing/rules/catch_all" "$catch_all_payload" \
            | jq '{success, errors, result: {name: .result.name, enabled: .result.enabled, actions: .result.actions}}'

          echo "Email Routing setup completed"
